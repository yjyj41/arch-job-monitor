name: Scrape jobs

on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC (London morning)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Commit updated data
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%F) jobs update"
          git push
